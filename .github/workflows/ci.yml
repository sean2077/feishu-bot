name: Verify Go gateway
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_sdk_version:
        description: Optional official Claude Agent SDK package version for a candidate native CLI run
        required: false
        type: string
      candidate_native_version:
        description: Exact native --version identity expected from that candidate package
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
  # Test tooling additionally checks GITHUB_ACTIONS and github-hosted isolation.
  FEISHU_ARTIFACT_SYSTEM_TRUST: '1'
jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.25.x', '1.27.x']
        include:
          - os: ubuntu-latest
            native-platform: linux-x64
          - os: windows-latest
            native-platform: win32-x64
          - os: ubuntu-24.04-arm
            go: '1.27.x'
            native-platform: linux-arm64
          - os: macos-15-intel
            go: '1.27.x'
            native-platform: darwin-x64
          - os: macos-15
            go: '1.27.x'
            native-platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # On these disposable macOS VMs, administrator trust lives until job
      # teardown. Per-test keychain/search-list cleanup remains mandatory.
      FEISHU_ARTIFACT_MACOS_TRUST_SCOPE: hosted_job
      FEISHU_ARTIFACT_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - uses: ./.github/actions/verify
        with:
          native-platform: ${{ matrix.native-platform }}
      - name: Verify Windows task discovery and recovery
        if: matrix.os == 'windows-latest' && matrix.go == '1.27.x'
        shell: bash
        env:
          FEISHU_BOT_TASK_TEST: '1'
        run: go test -race -count=1 -timeout 90s -v ./internal/cli -run '^TestWindowsTaskRegistration$'
      - name: Build and run the production binary without CGO
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          binary=./bin/feishu-bot
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary+=.exe
          fi
          artifact_commit="$(git rev-parse HEAD)"
          artifact_version="0.0.0-ci.$artifact_commit"
          go build -trimpath -ldflags "-X github.com/sean2077/feishu-bot/internal/cli.Version=$artifact_version" -o "$binary" ./cmd/feishu-bot
          "$binary" --help
          "$binary" --version
          python .github/scripts/artifact_fixture.py record --binary "$binary" \
            --version "$artifact_version" --commit "$artifact_commit" --output bin/BUILDINFO.json
      - name: Build the pinned previous binary for actual service upgrades
        shell: bash
        run: python .github/scripts/artifact_fixture.py baseline --output bin/upgrade-baseline
      - name: Verify the actual built artifact against local providers
        shell: bash
        run: >-
          python .github/scripts/artifact_processes.py run --timeout 450 --cleanup-timeout 35 --
          go test -race -v -count=1 -timeout 420s ./internal/cli -run '^TestBuiltArtifact'
      - name: Release TLS fixture resources under the declared runner lifetime
        if: always() && runner.os != 'Linux'
        shell: bash
        run: python .github/scripts/artifact_trust.py cleanup-all
      - name: Retain public TLS fixture lifetime receipts
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tls-fixture-lifetime-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/feishu-artifact-trust/*/receipt.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Record advisory Go formatting patch
        if: always() && matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        shell: python
        run: |
          import os
          import subprocess
          import sys
          files = subprocess.check_output(['git', 'ls-files', '-z', '--', '*.go']).split(b'\0')
          failed = False
          with open('gofmt.patch', 'wb') as patch:
              for raw_path in files:
                  if not raw_path:
                      continue
                  path = os.fsdecode(raw_path)
                  result = subprocess.run(['gofmt', '-d', path], capture_output=True)
                  patch.write(result.stdout)
                  # A diff may use exit 1; syntax/tool errors must still fail.
                  if result.stderr or result.returncode not in (0, 1) or (result.returncode == 1 and not result.stdout):
                      failed = True
                      print(f'gofmt failed for {path} (exit {result.returncode})', file=sys.stderr)
                      sys.stderr.write(result.stderr.decode('utf-8', errors='replace'))
          raise SystemExit(failed)
      - name: Retain advisory Go formatting patch
        if: always() && matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gofmt-patch
          path: gofmt.patch
          if-no-files-found: warn
          retention-days: 7
      - name: Record rendering allocation observations
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        shell: bash
        run: go test ./internal/gateway -run '^$' -bench 'BenchmarkRender|BenchmarkReplyCard' -benchmem -benchtime=3x -count=3
      - name: Record native resource scenarios
        if: (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest') && matrix.go == '1.27.x'
        shell: bash
        run: |
          benchmark=./bin/benchmark-native
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            benchmark+=.exe
          fi
          go build -trimpath -o "$benchmark" ./cmd/benchmark-native
          "$benchmark" --samples 1 --warm-turns 0 --idle-ms 100 --scenario matrix > native-resource-observations.json
          "$benchmark" --samples 1 --scenario warm --sessions 2 --warm-turns 1 \
            --concurrent --soak-seconds 6 --max-turns 1000 --sample-ms 500 \
            --idle-ms 100 > native-concurrent-observations.json
      - name: Print resource observation summary
        if: always() && (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest') && matrix.go == '1.27.x'
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path('native-resource-observations.json')
          if path.exists() and path.stat().st_size:
              report = json.loads(path.read_text(encoding='utf-8'))
              print(json.dumps({'environment': report['environment'], 'native': report['native'], 'summary': report['summary']}, ensure_ascii=False))
              for sample in report['samples']:
                  memory = sample['idleMemory']
                  print(json.dumps({'scenario': sample['scenario'], 'status': sample['status'], 'workers': sample['workersStarted'], 'sessionStable': sample['sessionStable'], 'memoryStatus': memory['status'], 'hostResidentBytes': memory['hostBytes'], 'nativeResidentBytes': memory['nativeResidentBytes'], 'toolOrMcpResidentBytes': memory['toolOrMcpResidentBytes'], 'hostPrivateBytes': memory['hostPrivateBytes'], 'descendantPrivateBytes': memory['descendantPrivateBytes'], 'transport': sample['transport'], 'goAllocatedBytes': sample['goAllocatedBytes'], 'memorySampling': sample['memorySampling']}, ensure_ascii=False))
          path = Path('native-concurrent-observations.json')
          if path.exists() and path.stat().st_size:
              report = json.loads(path.read_text(encoding='utf-8'))
              for sample in report['samples']:
                  workload, trends = sample['workload'], sample['trends']
                  print(json.dumps({'scenario': sample['scenario'], 'status': sample['status'], 'workload': workload, 'trendPoints': len(trends['points']), 'droppedEarlierPoints': trends['droppedEarlierPoints'], 'latestMaintenance': trends['points'][-1]['maintenance'] if trends['points'] else None, 'cleanupConfirmed': sample['cleanupConfirmed']}, ensure_ascii=False))
                  if sample['status'] != 'passed' or not workload['concurrent'] or workload['peakInFlightTurns'] < 2 or workload['completedTurns'] != workload['attemptedTurns']:
                      raise SystemExit('concurrent native workload did not complete with overlapping room turns')
      - name: Retain resource observations
        if: always() && (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest') && matrix.go == '1.27.x'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-resource-observations-${{ runner.os }}-${{ runner.arch }}
          path: |
            native-resource-observations.json
            native-concurrent-observations.json
          if-no-files-found: warn
          retention-days: 7

  release-tools:
    name: Check release tooling and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test release tooling without publishing
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check GitHub Actions workflows
        shell: bash
        run: |
          actionlint_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$actionlint_dir"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$actionlint_dir/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$actionlint_dir/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
          "$actionlint_dir/actionlint" -color

  candidate-native:
    name: Explicit candidate native compatibility
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_sdk_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install and verify the explicitly selected candidate
        shell: python
        env:
          CANDIDATE_SDK_VERSION: ${{ inputs.candidate_sdk_version }}
          CANDIDATE_NATIVE_VERSION: ${{ inputs.candidate_native_version }}
        run: |
          import os
          from pathlib import Path
          import re
          import subprocess
          sdk = os.environ['CANDIDATE_SDK_VERSION']
          expected = os.environ['CANDIDATE_NATIVE_VERSION']
          if not re.fullmatch(r'0\.\d+\.\d+', sdk) or not re.fullmatch(r'\d+\.\d+\.\d+', expected):
              raise SystemExit('Explicit numeric SDK and native versions are required')
          fixture = Path(os.environ['RUNNER_TEMP']) / 'claude-candidate'
          subprocess.run(['npm', 'install', '--prefix', str(fixture), '--ignore-scripts', '--no-audit', '--no-fund', '@anthropic-ai/claude-agent-sdk@' + sdk], check=True)
          native = fixture / 'node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude'
          actual = subprocess.check_output([str(native), '--version'], text=True).strip()
          print('Candidate actual identity:', actual)
          print('Repository tested native fixture: 2.1.321')
          if actual != expected + ' (Claude Code)':
              raise SystemExit('Candidate package/native identity mismatch')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CLAUDE_NATIVE_PATH={native}\n')
      - name: Candidate protocol journey with deterministic local providers
        run: go test -race -count=1 -timeout 180s -v ./internal/native ./internal/integration ./cmd/benchmark-native
