name: Bootstrap locked dependencies
on:
  push:
    branches: [feat/native-feishu-gateway]
    paths: [.github/workflows/bootstrap-dependencies.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check against locally verified lock and commit only that file
        shell: bash
        run: |
          echo 'b7ecb4e025e16e9713d3abc8c9953fd2fed28f038c75c72fbc20f003a38e8ca1  package-lock.json' | sha256sum --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: add verified npm dependency lock'
          git push origin HEAD:refs/heads/feat/native-feishu-gateway
