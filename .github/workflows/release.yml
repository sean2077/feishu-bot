name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# A retry must not interrupt another publisher for the same immutable version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    name: Validate the tagged release
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate the exact tag, commit and release notes
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_commit="$(git rev-parse HEAD)"
          python .github/scripts/release.py prepare \
            --tag "$RELEASE_TAG" --commit "$release_commit" --output release-meta
          {
            printf 'commit=%s\n' "$release_commit"
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"
      - name: Retain validated release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata
          path: release-meta/
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            native-platform: linux-x64
            binary: bin/feishu-bot
            extension: tar.gz
            installer-extension: deb
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            native-platform: linux-arm64
            binary: bin/feishu-bot
            extension: tar.gz
            installer-extension: deb
          - runner: windows-2022
            goos: windows
            goarch: amd64
            native-platform: win32-x64
            binary: bin/feishu-bot.exe
            extension: zip
            installer-extension: msi
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            native-platform: darwin-x64
            binary: bin/feishu-bot
            extension: tar.gz
            installer-extension: ''
          - runner: macos-15
            goos: darwin
            goarch: arm64
            native-platform: darwin-arm64
            binary: bin/feishu-bot
            extension: tar.gz
            installer-extension: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_OS: ${{ matrix.goos }}
      RELEASE_ARCH: ${{ matrix.goarch }}
      RELEASE_BINARY: ${{ matrix.binary }}
      RELEASE_ARCHIVE: feishu-bot-${{ needs.prepare.outputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.extension }}
      RELEASE_INSTALLER: feishu-bot-${{ needs.prepare.outputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.installer-extension }}
      RELEASE_INSTALLER_EXTENSION: ${{ matrix.installer-extension }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install the pinned WiX toolset
        if: matrix.installer-extension == 'msi'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          curl.exe -L --fail --silent --show-error -o $zip "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31"
          if ($actual -ne $expected) { throw "WiX archive checksum mismatch" }
          $wix = Join-Path $env:RUNNER_TEMP "wix314"
          Expand-Archive -Path $zip -DestinationPath $wix -Force
          if (-not (Test-Path (Join-Path $wix "candle.exe"))) { throw "WiX candle.exe is missing" }
          "WIX_BIN=$wix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: ./.github/actions/verify
        with:
          native-platform: ${{ matrix.native-platform }}
      - name: Download the validated release identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-metadata
          path: release-meta
      - name: Build the native production binary
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          test "$(go env GOOS)" = "$RELEASE_OS"
          test "$(go env GOARCH)" = "$RELEASE_ARCH"
          mkdir -p bin
          # BUILDINFO in the archive records the exact commit. Generated release
          # metadata must not change Go's automatic VCS dirty marker between runs.
          go build -trimpath -buildvcs=false \
            -ldflags "-X github.com/sean2077/feishu-bot/internal/cli.Version=$RELEASE_VERSION" \
            -o "$RELEASE_BINARY" ./cmd/feishu-bot
      - name: Package the release binary
        shell: bash
        run: |
          python .github/scripts/release.py package \
            --metadata release-meta/release.json --binary "$RELEASE_BINARY" \
            --os "$RELEASE_OS" --arch "$RELEASE_ARCH" --output dist
      - name: Run the unpacked archive on its native platform
        shell: bash
        run: |
          python .github/scripts/release.py smoke \
            --metadata release-meta/release.json --archive "dist/$RELEASE_ARCHIVE" \
            --os "$RELEASE_OS" --arch "$RELEASE_ARCH"
      - name: Retain the verified platform archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ env.RELEASE_ARCHIVE }}
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Build and reverify the platform installer
        if: matrix.installer-extension != ''
        shell: bash
        run: |
          installer=(--metadata release-meta/release.json --binary "$RELEASE_BINARY"
                     --os "$RELEASE_OS" --arch "$RELEASE_ARCH")
          if [[ "$RELEASE_INSTALLER_EXTENSION" == "msi" ]]; then
            installer+=(--wix-bin "$WIX_BIN")
          fi
          python .github/scripts/release.py package-installer "${installer[@]}" --output dist
          python .github/scripts/release.py package-installer "${installer[@]}" --output dist-repro
          cmp "dist/$RELEASE_INSTALLER" "dist-repro/$RELEASE_INSTALLER"
      - name: Run the installer on its native platform
        if: matrix.installer-extension != ''
        shell: bash
        run: |
          python .github/scripts/release.py smoke-installer \
            --metadata release-meta/release.json --installer "dist/$RELEASE_INSTALLER" \
            --os "$RELEASE_OS" --arch "$RELEASE_ARCH"
      - name: Retain the verified platform installer
        if: matrix.installer-extension != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-installers-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ env.RELEASE_INSTALLER }}
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish the complete GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-metadata
          path: release-meta
      - name: Download every verified platform archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true
      - name: Download every verified platform installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-installers-*
          path: dist
          merge-multiple: true
      - name: Verify the complete payload and create checksums
        run: |
          python .github/scripts/release.py verify \
            --metadata release-meta/release.json --artifacts dist
      - name: Upload, verify and publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python .github/scripts/publish_release.py \
            --metadata release-meta/release.json --notes release-meta/release-notes.md \
            --artifacts dist --repository "$GITHUB_REPOSITORY"
